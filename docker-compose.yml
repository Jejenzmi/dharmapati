# Infrastruktur pengembangan lokal: PostgreSQL, Redis, MinIO
services:
  db:
    image: postgres:16-alpine
    container_name: dharmapati_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dharmapati
      POSTGRES_PASSWORD: dharmapati123
      POSTGRES_DB: dharmapati
    ports:
      - "5490:5432"
    volumes:
      - dharmapati_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dharmapati -d dharmapati"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dharmapati_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6430:6379"
    volumes:
      - dharmapati_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: dharmapati_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dharmapati
      MINIO_ROOT_PASSWORD: dharmapati123
    ports:
      - "9070:9000"
      - "9071:9001"
    volumes:
      - dharmapati_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dharmapati_db:
  dharmapati_redis:
  dharmapati_minio:
