# Susunan produksi dharmapati.co.id
name: dharmapati

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dharmapati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-dharmapati}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dharmapati} -d ${POSTGRES_DB:-dharmapati}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dharmapati}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?wajib diisi}
      MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN:-dharmapati.co.id}/minio
    ports:
      - "127.0.0.1:9120:9000"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: 5041
      DATABASE_URL: postgresql://${POSTGRES_USER:-dharmapati}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dharmapati}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?wajib diisi}
      CORS_ORIGIN: https://${DOMAIN:-dharmapati.co.id},https://www.${DOMAIN:-dharmapati.co.id}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dharmapati}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dharmapati
      MINIO_PUBLIC_URL: https://${DOMAIN:-dharmapati.co.id}/berkas
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "127.0.0.1:5042:5041"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      # Jaringan host agar prarender dapat menghubungi API yang sedang berjalan
      network: host
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-dharmapati.co.id}
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-dharmapati.co.id}
        API_URL: ${API_URL_BANGUN:-http://127.0.0.1:5042}
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    environment:
      NODE_ENV: production
      API_URL: http://api:5041
      NEXT_PUBLIC_API_URL: https://${DOMAIN:-dharmapati.co.id}
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-dharmapati.co.id}
    ports:
      - "127.0.0.1:8118:3000"

volumes:
  db:
  redis:
  minio:
