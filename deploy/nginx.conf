# dharmapati.co.id — situs PT. Dharmapati Putra Nusantara
server {
    listen 80;
    listen [::]:80;
    server_name dharmapati.co.id www.dharmapati.co.id;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dharmapati.co.id$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dharmapati.co.id;

    ssl_certificate     /etc/letsencrypt/live/dharmapati.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dharmapati.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dharmapati.co.id$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dharmapati.co.id;

    ssl_certificate     /etc/letsencrypt/live/dharmapati.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dharmapati.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # API Express
    location /api/ {
        proxy_pass http://127.0.0.1:5042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sehat {
        proxy_pass http://127.0.0.1:5042/sehat;
        proxy_set_header Host $host;
    }

    # Berkas unggahan di MinIO
    location /berkas/ {
        proxy_pass http://127.0.0.1:9120/dharmapati/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Aset statis Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8118;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Situs Next.js
    location / {
        proxy_pass http://127.0.0.1:8118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
